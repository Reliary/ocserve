# cargo-deny configuration (SRE §CI gates — run locally via scripts/nightly.sh;
# promoted to PR CI when a remote exists). Deny-list model: everything not
# explicitly allowed is rejected, so new deps with odd licenses fail loudly.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    # D1 rolldown tree (named dispositions, 2026-10-06):
    #   BSD-2-Clause — pnp (via oxc_resolver); sibling of existing BSD-3-Clause,
    #                  OSI-approved, same permissive family
    #   BSL-1.0      — xxhash-rust; Boost Software License, OSI-approved
    "BSD-2-Clause",
    "BSL-1.0",
]
# confidence floor: unlicensed/unknown crates fail the check, never pass quietly
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# intra-workspace path deps (refine-* = { path }) are wildcard-shaped by
# design; registry version wildcards stay denied
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
