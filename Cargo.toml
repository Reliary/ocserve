[workspace]
resolver = "2"
members = [
    "crates/ocserve-core",
    "crates/ocserve-store",
    "crates/ocserve-http",
    "crates/ocserve-llm",
    "crates/ocserve-tools",
    "crates/ocserve-mcp",
    "crates/ocserve-plugin",
    "crates/ocserve-importer",
    "crates/ocserve-metrics",
    "crates/ocserve-pty",
    "crates/ocserve-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
repository = "https://github.com/Reliary/ocserve"
homepage = "https://github.com/Reliary/ocserve"
keywords = ["opencode", "server", "sqlite", "sse", "api"]
categories = ["web-programming::http-server", "database-implementations", "development-tools"]

[workspace.dependencies]
# internal
ocserve-core = { path = "crates/ocserve-core", version = "0.1.0" }
ocserve-store = { path = "crates/ocserve-store", version = "0.1.0" }
ocserve-http = { path = "crates/ocserve-http", version = "0.1.0" }
ocserve-llm = { path = "crates/ocserve-llm", version = "0.1.0" }
ocserve-tools = { path = "crates/ocserve-tools", version = "0.1.0" }
ocserve-mcp = { path = "crates/ocserve-mcp", version = "0.1.0" }
ocserve-plugin = { path = "crates/ocserve-plugin", version = "0.1.0" }
ocserve-metrics = { path = "crates/ocserve-metrics", version = "0.1.0" }
ocserve-pty = { path = "crates/ocserve-pty", version = "0.1.0" }
ocserve-importer = { path = "crates/ocserve-importer", version = "0.1.0" }

# runtime / web
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs", "io-util", "net"] }
axum = { version = "0.8", features = ["json", "ws"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors"] }
hyper = "1"
bytes = "1"

# storage
rusqlite = { version = "0.40", features = ["bundled", "blob", "column_decltype"] }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
zstd = "0.14"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.1"

# misc
libc = "0.2"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.11"
rolldown = "1"
rolldown_common = "1"
base64 = "0.23"
hex = "0.4"
futures-util = "0.3"
parking_lot = "0.12"
rustc-hash = "2"

# metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = 1
