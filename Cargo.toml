[workspace]
resolver = "2"
members = [
    "crates/ocserve-core",
    "crates/ocserve-store",
    "crates/ocserve-http",
    "crates/ocserve-llm",
    "crates/ocserve-tools",
    "crates/ocserve-mcp",
    "crates/ocserve-plugin",
    "crates/ocserve-importer",
    "crates/ocserve-metrics",
    "crates/ocserve-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.98"
publish = false

[workspace.dependencies]
# internal
ocserve-core = { path = "crates/ocserve-core" }
ocserve-store = { path = "crates/ocserve-store" }
ocserve-http = { path = "crates/ocserve-http" }
ocserve-llm = { path = "crates/ocserve-llm" }
ocserve-tools = { path = "crates/ocserve-tools" }
ocserve-mcp = { path = "crates/ocserve-mcp" }
ocserve-plugin = { path = "crates/ocserve-plugin" }
ocserve-metrics = { path = "crates/ocserve-metrics" }
ocserve-importer = { path = "crates/ocserve-importer" }

# runtime / web
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs", "io-util", "net"] }
axum = { version = "0.8", features = ["json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
hyper = "1"
bytes = "1"

# storage
rusqlite = { version = "0.40", features = ["bundled", "blob", "column_decltype"] }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
zstd = "0.13"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"

# misc
libc = "0.2"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
rolldown = "1"
rolldown_common = "1"
base64 = "0.22"
hex = "0.4"
futures-util = "0.3"
parking_lot = "0.12"
rustc-hash = "2"

# metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = 1
