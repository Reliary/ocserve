name: publish

# Publishes the crate family to crates.io in dependency order.
#
# Trigger: pushing a v* tag publishes; the manual workflow_dispatch defaults to
# dry-run so a release can be rehearsed without uploading.
#
# Requires the CARGO_REGISTRY_TOKEN repository secret.
#
# The ordered list must contain EVERY workspace crate, in dependency order.
# ocserve-pty is a dependency of ocserve-http — omitting it (the 2026-10-12
# finding) makes publish abort at ocserve-http because its dependency is not on
# the registry. Keep this list in lockstep with Cargo.toml members.

# Manual-only until a CARGO_REGISTRY_TOKEN repository secret exists (none yet —
# publishing is done from the maintainer's local Cargo credentials for v0.2.0).
# When the secret is added, restore the `push: tags: ['v*']` trigger.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry-run (package + verify, no upload)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: crates.io publish (ordered)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@46a9d261ee2ace4b93b3bd6e867168ac38627b38  # v1.12.0

      - name: verify + test
        run: |
          cargo check --workspace --release
          cargo test --workspace

      # The ordered list must cover every member in dependency order. This
      # guard derives both from Cargo.toml, so a new crate cannot be forgotten.
      - name: publish order guard
        run: python3 scripts/check-publish-order.py

      - name: crates are packageable
        run: |
          set -euo pipefail
          for c in ocserve-metrics ocserve-llm ocserve-mcp ocserve-plugin ocserve-store \
                   ocserve-importer ocserve-tools ocserve-core ocserve-pty ocserve-http ocserve; do
            cargo package -p "$c" --list --allow-dirty >/dev/null
          done

      - name: publish (dry-run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          for c in ocserve-metrics ocserve-llm ocserve-mcp ocserve-plugin ocserve-store \
                   ocserve-importer ocserve-tools ocserve-core ocserve-pty ocserve-http ocserve; do
            echo "::group::dry-run $c"
            cargo publish -p "$c" --dry-run --allow-dirty --no-verify
            echo "::endgroup::"
          done

      - name: publish
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -uo pipefail
          publish() {
            c="$1"
            echo "::group::publish $c"
            if cargo publish -p "$c" --no-verify; then
              echo "published $c"
            else
              # Idempotent re-run: an already-uploaded version is fine.
              echo "publish of $c failed (may already be published) — continuing"
            fi
            echo "::endgroup::"
            sleep 30   # crates.io index propagation before dependents resolve
          }
          for c in ocserve-metrics ocserve-llm ocserve-mcp ocserve-plugin ocserve-store \
                   ocserve-importer ocserve-tools ocserve-core ocserve-pty ocserve-http ocserve; do
            publish "$c"
          done
