name: publish

# Publishes the crate family to crates.io in dependency order.
#
# Trigger: pushing a v* tag publishes; the manual workflow_dispatch defaults to
# dry-run so a release can be rehearsed without uploading.
#
# Requires the CARGO_REGISTRY_TOKEN repository secret.
#
# The ordered list must contain EVERY workspace crate, in dependency order.
# ocserve-pty is a dependency of ocserve-http — omitting it (the 2026-10-12
# finding) makes publish abort at ocserve-http because its dependency is not on
# the registry. Keep this list in lockstep with Cargo.toml members.

# A v* tag publishes; workflow_dispatch defaults to dry-run so a release can be
# rehearsed without uploading. Requires the CARGO_REGISTRY_TOKEN secret — the
# job fails loudly at the first upload if it is missing, and because `ocserve`
# is published LAST a missing token cannot leave users pointed at a half-chain.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry-run (package + verify, no upload)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: crates.io publish (ordered)
    runs-on: ubuntu-latest
    # crates.io's per-crate upload ceiling, declared here so the registry's
    # real limit has exactly ONE declaration (check-crate-payload.py reads it).
    #
    # crates.io's default per-crate cap. The web UI is sharded across
    # `ocserve-ui-*` crates (see scripts/shard-pack.py) so every member fits;
    # there is NO per-crate increase (the API reports max_upload_size: null),
    # and a size request was sent by the maintainer on 2026-10-20 and is
    # pending. If a grant lands, this value can rise, but nothing depends on
    # it: the shards are the shipping design.
    env:
      CRATE_PAYLOAD_LIMIT_BYTES: 10485760 # 10 MiB
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@c8ff772090ab9d00f7f7bd7b388f3c3032282e3b  # v2.0.0

      - name: verify + test
        run: |
          cargo check --workspace --release
          cargo test --workspace

      # The ordered list must cover every member in dependency order. This
      # guard derives both from Cargo.toml, so a new crate cannot be forgotten.
      - name: publish order guard
        run: python3 scripts/check-publish-order.py

      # Byte payload vs the registry's upload ceiling. `cargo package --list`
      # above validates LAYOUT only — it never looks at sizes — so without this
      # a fat crate only fails on publish day, when the ordered chain aborts.
      - name: crate payload size guard
        run: python3 scripts/check-crate-payload.py

      - name: crates are packageable
        run: |
          set -euo pipefail
          # Order is DERIVED from Cargo.toml, never hand-maintained: a new
          # crate (the six `ocserve-ui-*` shards, for example) cannot be
          # forgotten or mis-ordered.
          mapfile -t CRATES < <(python3 scripts/check-publish-order.py --order)
          for c in "${CRATES[@]}"; do
            cargo package -p "$c" --list --allow-dirty >/dev/null
          done

      - name: publish (dry-run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -uo pipefail
          # A whole-chain dry-run is impossible: `cargo publish --dry-run`
          # resolves INTERNAL deps from crates.io, and in a release those
          # versions do not exist yet (the first run failed here with
          # "failed to select a version for ocserve-store = ^0.6.9"). Dry-run
          # the crates that can resolve; skip dependents with an explicit note
          # so the rehearsal still proves packaging, ordering and payload size.
          mapfile -t CRATES < <(python3 scripts/check-publish-order.py --order)
          rc=0
          for c in "${CRATES[@]}"; do
            echo "::group::dry-run $c"
            if out=$(cargo publish -p "$c" --dry-run --allow-dirty --no-verify 2>&1); then
              echo "$out"
            elif printf '%s' "$out" | grep -q 'failed to select a version for the requirement'; then
              echo "skip: depends on an internal crate not yet published at this version"
            else
              echo "$out"; echo "FAIL: dry-run packaging failed for $c"; rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

      - name: publish
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -uo pipefail
          publish() {
            c="$1"
            attempt=1
            while [ "$attempt" -le 4 ]; do
              echo "::group::publish $c (attempt $attempt)"
              if out=$(cargo publish -p "$c" --no-verify 2>&1); then
                echo "$out"; echo "published $c"; echo "::endgroup::"
                sleep 30   # index propagation before dependents resolve
                return 0
              fi
              echo "$out"
              # Only an already-present version is benign. Anything else must
              # stop the chain: the old "continue on any failure" silently left
              # a crate unpublished and then failed every dependent, after the
              # earlier crates had already been uploaded (unrecoverable).
              if printf '%s' "$out" | grep -qiE 'already exists|already uploaded|crate version .* is already'; then
                echo "already published: $c"; echo "::endgroup::"
                sleep 30
                return 0
              fi
              if printf '%s' "$out" | grep -qiE 'too many new crates|429|rate limit'; then
                echo "rate limited; waiting 10 minutes (5 new crates / 10 min)"; echo "::endgroup::"
                sleep 600
                attempt=$((attempt + 1))
                continue
              fi
              if printf '%s' "$out" | grep -q 'failed to select a version for the requirement'; then
                # The dependency was just uploaded but the sparse index has
                # not caught up. Wait and retry the SAME crate.
                echo "dependency not visible yet; retrying in 45s"
                sleep 45
                attempt=$((attempt + 1))
                continue
              fi
              echo "::endgroup::"
              echo "FAIL: $c failed to publish and is not already on the registry"; return 1
            done
            echo "FAIL: $c still rate-limited after $((attempt - 1)) waits"; return 1
          }
          mapfile -t CRATES < <(python3 scripts/check-publish-order.py --order)
          for c in "${CRATES[@]}"; do
            publish "$c" || exit 1
          done

      # End-to-end check that the uploaded crates actually build for a user —
      # the registry-resolving `cargo install` compiles the real published
      # tarballs (incl. compiled-in assets). This is where the 0.3.0 defect
      # (include_*! escaping the crate root, so `cargo install ocserve` failed)
      # would be caught after upload; rule 30 catches it pre-upload.
      - name: cargo install smoke (published crates)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          CARGO_HOME="$(mktemp -d)" cargo install ocserve --root "$(mktemp -d)" --locked || \
            CARGO_HOME="$(mktemp -d)" cargo install ocserve --root "$(mktemp -d)"
          echo "cargo install ocserve: OK"
