name: ci

# Fast, deterministic gates on every push/PR. No network, no Docker, no
# vendored freeze — the provider-boundary and route-replay gates live in
# capdiff.yml / replay.yml so a missing artifact degrades that job, not this
# one.
#
# Action SHAs are pinned (family convention) with the version in a trailing
# comment; Dependabot updates both together.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: gates (fmt, clippy, tests, guards, matrix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@46a9d261ee2ace4b93b3bd6e867168ac38627b38  # v1.12.0
        with:
          toolchain: stable
          components: rustfmt, clippy


      - name: format
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: tests
        run: cargo test --workspace

      - name: guards (static bug-class rules)
        run: ./scripts/check-guards.sh

      - name: traceability matrix
        run: ./scripts/check-matrix.sh

      # The test count must not silently drop: a falling count means tests were
      # deleted or started skipping. Ratchet: recorded floor, raised over time.
      - name: test count ratchet
        run: |
          count=$(cargo test --workspace 2>&1 | grep "^test result:" | \
            grep -oP '\d+(?= passed)' | \
            python3 -c "import sys; print(sum(int(l) for l in sys.stdin if l.strip()))")
          echo "test count: $count"
          FLOOR=470
          if [ "$count" -lt "$FLOOR" ]; then
            echo "FAIL: test count $count below floor $FLOOR — tests removed or skipping"; exit 1
          fi

      # Every crate's tarball must contain its files. `cargo package --list`
      # validates the package layout offline (the missing-file class) without
      # resolving the registry — `cargo package` proper compiles the packed
      # crate against PUBLISHED siblings, which is circular on a release that
      # bumps versions (the local fix isn't on crates.io yet), so it can only
      # run post-publish. The compiled-in-asset class it would catch (0.3.0:
      # include_*! escaping the crate root breaks `cargo install`) is caught
      # pre-publish by check-guards rule 30; the end-to-end `cargo install`
      # smoke runs in publish.yml after upload.
      - name: crates are packageable
        run: |
          set -euo pipefail
          for c in ocserve-metrics ocserve-llm ocserve-mcp ocserve-plugin ocserve-store \
                   ocserve-importer ocserve-tools ocserve-core ocserve-pty ocserve-http ocserve; do
            echo "::group::package --list $c"
            cargo package -p "$c" --list --allow-dirty >/dev/null
            echo "::endgroup::"
          done

      # The publish workflow's ordered list must cover every workspace member,
      # in dependency order (the ocserve-pty omission / wrong-order class).
      - name: publish order guard
        run: python3 scripts/check-publish-order.py && python3 scripts/check-publish-order.py --selftest

      # release build + artifact: the release artifact is the product; build it
      # on every push so a broken release build is caught by CI (not tag day).
      - name: build release
        run: cargo build --release -p ocserve

      - name: upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.0
        with:
          name: ocserve-linux-x86_64
          path: target/release/ocserve
          if-no-files-found: error

  size:
    name: binary size ceiling
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@46a9d261ee2ace4b93b3bd6e867168ac38627b38  # v1.12.0
      - name: build + check size
        run: |
          cargo build --release -p ocserve
          SIZE=$(stat -c %s target/release/ocserve)
          echo "binary size: $SIZE bytes"
          # Ceiling re-baselined from measurement, never bypassed (SRE §5 / the
          # provenance rule): 9,279,528 (2026-10-03) -> 30,000,000 (web-UI
          # embedded bundle, v2 surface). Headroom is intentional: rolldown +
          # embedded UI are the large static contributors.
          MAX=30000000
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "FAIL: binary $SIZE exceeds ceiling $MAX — re-baseline with provenance";
            exit 1
          fi

  cross:
    name: cross-compile check (aarch64-linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@46a9d261ee2ace4b93b3bd6e867168ac38627b38  # v1.12.0
      - name: install arm64 cross toolchain + target
        run: |
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: cargo check (aarch64)
        run: cargo check --workspace --release --target aarch64-unknown-linux-gnu

  audit:
    name: audit + deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@46a9d261ee2ace4b93b3bd6e867168ac38627b38  # v1.12.0
      - name: install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo-deny
        run: cargo deny check
      - name: cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
