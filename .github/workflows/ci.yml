name: ci

# Fast, deterministic gates on every push/PR. No network, no Docker, no
# vendored freeze — the provider-boundary and route-replay gates live in
# capdiff.yml / replay.yml so a missing artifact degrades that job, not this
# one.
#
# Action SHAs are pinned (family convention) with the version in a trailing
# comment; Dependabot updates both together.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: gates (fmt, clippy, tests, guards, matrix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions-rust-lang/setup-rust-toolchain@46a9d261ee2ace4b93b3bd6e867168ac38627b38  # v1.12.0
        with:
          toolchain: stable
          components: rustfmt, clippy


      - name: format
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: tests
        run: cargo test --workspace

      - name: guards (static bug-class rules)
        run: ./scripts/check-guards.sh

      - name: traceability matrix
        run: ./scripts/check-matrix.sh

      # The test count must not silently drop: a falling count means tests were
      # deleted or started skipping. Ratchet: recorded floor, raised over time.
      - name: test count ratchet
        run: |
          count=$(cargo test --workspace 2>&1 | grep "^test result:" | \
            grep -oP '\d+(?= passed)' | \
            python3 -c "import sys; print(sum(int(l) for l in sys.stdin if l.strip()))")
          echo "test count: $count"
          FLOOR=470
          if [ "$count" -lt "$FLOOR" ]; then
            echo "FAIL: test count $count below floor $FLOOR — tests removed or skipping"; exit 1
          fi

      # Every crate's tarball must contain its files. `cargo package --list`
      # validates the package layout offline (the missing-file class) without
      # resolving the registry — `cargo package` proper compiles the packed
      # crate against PUBLISHED siblings, which is circular on a release that
      # bumps versions (the local fix isn't on crates.io yet), so it can only
      # run post-publish. The compiled-in-asset class it would catch (0.3.0:
      # include_*! escaping the crate root breaks `cargo install`) is caught
      # pre-publish by check-guards rule 30; the end-to-end `cargo install`
      # smoke runs in publish.yml after upload.
      - name: crates are packageable
        run: |
          set -euo pipefail
          for c in ocserve-metrics ocserve-llm ocserve-mcp ocserve-plugin ocserve-store \
                   ocserve-importer ocserve-tools ocserve-core ocserve-pty ocserve-http ocserve; do
            echo "::group::package --list $c"
            cargo package -p "$c" --list --allow-dirty >/dev/null
            echo "::endgroup::"
          done

      # The publish workflow's ordered list must cover every workspace member,
      # in dependency order (the ocserve-pty omission / wrong-order class).
      - name: publish order guard
        run: python3 scripts/check-publish-order.py && python3 scripts/check-publish-order.py --selftest

      # Byte payload vs the registry's upload ceiling. `cargo package --list`
      # below validates LAYOUT only, so nothing else catches a crate that grew
      # past the limit (the 2026-10-18 finding: two embedded web-UI packs push
      # ocserve-http to ~35 MB). The cap is declared once, in publish.yml.
      - name: crate payload size guard
        run: python3 scripts/check-crate-payload.py && python3 scripts/check-crate-payload.py --selftest

      # release build + artifact: the release artifact is the product; build it
      # on every push so a broken release build is caught by CI (not tag day).
      - name: build release
        run: cargo build --release -p ocserve

      - name: upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.0
        with:
          name: ocserve-linux-x86_64
          path: target/release/ocserve
          if-no-files-found: error

  size:
    name: binary size ceiling
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions-rust-lang/setup-rust-toolchain@46a9d261ee2ace4b93b3bd6e867168ac38627b38  # v1.12.0
      - name: build + check size
        run: |
          cargo build --release -p ocserve
          SIZE=$(stat -c %s target/release/ocserve)
          echo "binary size: $SIZE bytes"
          # Ceiling re-baselined from measurement, never bypassed (SRE §5 / the
          # provenance rule): 9,279,528 (2026-10-03) -> 30,000,000 (web-UI
          # embedded bundle, v2 surface) -> 34,000,000 (second embedded web
          # pack, Phase E) -> 62,000,000 (K-SECREV full web-UI closure: both
          # packs complete + OCAP2 per-file frames; see scripts/nightly.sh).
          # Headroom is intentional: rolldown + embedded UI are the large
          # static contributors.
          MAX=62000000
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "FAIL: binary $SIZE exceeds ceiling $MAX — re-baseline with provenance";
            exit 1
          fi

  cross:
    name: cross-compile check (aarch64-linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions-rust-lang/setup-rust-toolchain@46a9d261ee2ace4b93b3bd6e867168ac38627b38  # v1.12.0
      - name: install arm64 cross toolchain + target
        run: |
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: cargo check (aarch64)
        run: cargo check --workspace --release --target aarch64-unknown-linux-gnu

  platform-check:
    # Proves the two Windows compile blockers stay fixed, on a real Windows and
    # macOS toolchain. The C dependencies (SQLite/zstd/ring/blake3) cannot be
    # cross-compiled from Linux without the Windows SDK, so this must run on the
    # target OS — that is exactly why it is a separate job and not part of the
    # Linux `check`.
    #
    # Runtime behaviour is NOT covered here: no test is run. PLATFORM.md records
    # that as D-PLATFORM-UNVERIFIED until Phase P/W add PTY and shell e2e.
    #
    # Verified locally with `cargo xwin check --workspace --all-targets` before
    # enabling: x86_64-msvc is clean (warnings only) and found two real
    # test-target bugs that a plain `cargo check` missed. aarch64-msvc cannot be
    # cross-checked on Linux (ring's pregenerated asm needs a clang that accepts
    # `/imsvc`); that target is checked by the release build on a real runner.
    name: platform check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions-rust-lang/setup-rust-toolchain@46a9d261ee2ace4b93b3bd6e867168ac38627b38  # v1.12.0
      - name: cargo check
        # `check`, not `build`: link-time gaps in the OS layer are Phase P/W work,
        # and a type error is what the two ungated unix imports used to produce.
        #
        # Output is captured to a file and re-printed, then uploaded: job logs
        # need repo-admin rights on this private repo (HTTP 403 via `gh`), and a
        # red job nobody can read is the same class of defect as a vacuous guard.
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace --all-targets 2>&1 | tee check.log
          rc=${PIPESTATUS[0]}
          { echo "## cargo check (${{ matrix.os }})"; echo '```'; tail -120 check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: annotate failures
        if: failure()
        shell: bash
        # Step summaries and artifacts both need auth to read on this repo; an
        # ANNOTATION is visible in the run UI without any. One line per distinct
        # error so the failure is legible without `gh`.
        # `check.log` carries ANSI colour codes, so `^error` never matched and
        # `-eo pipefail` failed the diagnostic step itself. Strip escapes, and
        # never let this step fail the job (`|| true`): diagnostics that can go
        # red are the same defect class as a guard nobody can observe.
        run: |
          sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' check.log \
            | grep -E '^error(\[|:)' \
            | sort -u | head -20 \
            | while IFS= read -r line; do
                echo "::error title=${{ matrix.os }}::$line"
              done || true
          exit 0
      - name: upload check log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.0
        with:
          name: check-${{ matrix.os }}
          path: check.log
          if-no-files-found: ignore
      - name: PTY acceptance (real process, both platforms)
        # `cargo check` proves the platform modules compile; this proves a real
        # shell runs with a terminal attached and its output comes back. It is
        # the only PTY test that needs no HTTP layer, so it belongs here.
        # On Windows it is the first execution of the ConPTY path anywhere.
        shell: bash
        run: cargo test -p ocserve-pty -- --nocapture

      - name: guard suite (macOS)
        if: runner.os == 'macOS'
        # The guard suite is bash+python. Running it here proves the scripts are
        # BSD-userland clean (the rule-27 plant used `sed -i` without a suffix,
        # which is GNU-only).
        #
        # `jsonschema` is a real dependency of the event validator and is
        # preinstalled on the Linux runner but NOT on macOS; without it rule 19
        # reports "vacuous/broken" because the import fails. Installing it here
        # keeps the guard honest instead of skipping the rule on this platform.
        # macOS ships a PEP-668 "externally managed" Python: `pip install` into
        # it is refused. Use a throwaway venv instead of --break-system-packages
        # so nothing on the runner image is mutated.
        run: |
          python3 -m venv "$RUNNER_TEMP/guardvenv"
          "$RUNNER_TEMP/guardvenv/bin/pip" install --quiet --disable-pip-version-check jsonschema
          PATH="$RUNNER_TEMP/guardvenv/bin:$PATH" ./scripts/check-guards.sh

      - name: PTY acceptance (macOS)
        if: runner.os == 'macOS'
        # This is the line between "wrote a macOS PTY" and "a macOS runner
        # exercised it": real forkpty spawn, type, resize (TIOCGWINSZ round-trip
        # proves the Darwin ioctl constant), exit code, and kill.
        # `-D warnings` matches the toolchain's default RUSTFLAGS.
        shell: bash
        run: |
          set -o pipefail
          RUSTFLAGS="-D warnings" cargo test -p ocserve-pty -- --nocapture 2>&1 | tee pty.log
          RUSTFLAGS="-D warnings" cargo test -p ocserve-http --test pty 2>&1 | tee -a pty.log

  audit:
    name: audit + deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions-rust-lang/setup-rust-toolchain@46a9d261ee2ace4b93b3bd6e867168ac38627b38  # v1.12.0
      - name: install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo-deny
        run: cargo deny check
      - name: cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
