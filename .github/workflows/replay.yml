name: replay

# Differential gates against the frozen upstream (opencode 1.18.31).
#
# These are the compatibility oracle: route replay against the recorded golden
# corpus, the live provider-boundary differential (capdiff), and the live
# server-to-server pair differential. They need the freeze binary, which is
# acquired from npm at the pinned version (the same mechanism
# bench/parity/Dockerfile.upstream-npm uses) — never committed.
#
# Job names are stable: branch protection requires "differential wire replay".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  OCSERVE_BIN: target/release/ocserve

jobs:
  replay:
    name: differential wire replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: dtolnay/rust-toolchain@stable  # ref IS the toolchain name (do not SHA-pin)
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c  # v2
      - name: build
        run: cargo build --release -p ocserve
      - name: replay against the frozen corpus
        run: ./scripts/replay-check.sh

  capdiff:
    name: provider-boundary differential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: dtolnay/rust-toolchain@stable  # ref IS the toolchain name (do not SHA-pin)
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c  # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - name: build ocserve
        run: cargo build --release -p ocserve
      - name: acquire frozen upstream (1.18.31)
        run: ./scripts/acquire-freeze.sh
      - name: capdiff (comparator self-test + full matrix, forward + reverse)
        run: |
          ./scripts/capdiff-check.sh --selftest
          ./scripts/capdiff-check.sh --full
          ./scripts/capdiff-check.sh --full --reverse

  pair:
    name: live pair differential
    runs-on: ubuntu-latest
    needs: capdiff
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: dtolnay/rust-toolchain@stable  # ref IS the toolchain name (do not SHA-pin)
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c  # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - name: build ocserve
        run: cargo build --release -p ocserve
      - name: acquire frozen upstream (1.18.31)
        run: ./scripts/acquire-freeze.sh
      - name: pair differential
        run: ./scripts/pair-check.sh
