name: replay

# Differential wire replay against the recorded golden corpus. Pure Rust +
# committed fixtures — deterministic, offline, and the compatibility oracle
# required by branch protection (job name "differential wire replay").
#
# The FREEZE-BASED differentials (capdiff provider-boundary, pair live
# server-to-server) run with the vendored opencode 1.18.31 binary, which the
# GitHub-hosted runner cannot drive reliably (the freeze returns HTTP 500 on a
# message POST there — runner-specific, byte-identical binary). They live in
# the local nightly (`scripts/nightly.sh`) and stay manual until a self-hosted
# runner exists (decided 2026-10-12). scripts/acquire-freeze.sh stages the
# binary for a local run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  OCSERVE_BIN: target/release/ocserve

jobs:
  replay:
    name: differential wire replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@c8ff772090ab9d00f7f7bd7b388f3c3032282e3b  # v1.12.0
      - name: build
        run: cargo build --release -p ocserve
      - name: replay against the frozen corpus
        run: ./scripts/replay-check.sh
