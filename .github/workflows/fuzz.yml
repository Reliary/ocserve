name: fuzz

# Weekly + on-demand fuzzing of the parsers (SSE line parser, splice JSON
# passthrough, typed wire decode). Targets live in fuzz/ (own workspace,
# excluded from the main build graph).
#
# Run locally: `cargo +nightly fuzz run sse_parser`

on:
  schedule:
    - cron: '0 6 * * 1'   # Monday 06:00
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: cargo-fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: install nightly + cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
      - name: build targets
        run: cargo +nightly fuzz build
      - name: run sse_parser (60s)
        run: cargo +nightly fuzz run sse_parser -- -max_total_time=60 -timeout=30
      - name: run splice_parser (60s)
        run: cargo +nightly fuzz run splice_parser -- -max_total_time=60 -timeout=30
      - name: run wire_decode (60s)
        run: cargo +nightly fuzz run wire_decode -- -max_total_time=60 -timeout=30
