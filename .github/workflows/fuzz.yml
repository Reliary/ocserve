name: fuzz

# Weekly + on-demand fuzzing of the parsers (SSE line parser, splice JSON
# passthrough, typed wire decode, event decoder, provider stream assembler,
# config TOML, substr window math, MCP JSON-RPC). Targets live in fuzz/ (own
# workspace, excluded from the main build graph). Every TESTING §6 target is
# present; a new parser ships with its target or a named justification.
#
# Run locally: `cargo +nightly fuzz run sse_parser`

on:
  schedule:
    - cron: '0 6 * * 1'   # Monday 06:00
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: cargo-fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - sse_parser
          - splice_parser
          - wire_decode
          - event_decoder
          - stream_assembler
          - config_toml
          - substr_window
          - mcp_jsonrpc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: install nightly + cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
      - name: run ${{ matrix.target }} (60s)
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60 -timeout=30

