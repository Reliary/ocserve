name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 8 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (rust)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['rust']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: dtolnay/rust-toolchain@stable  # ref IS the toolchain name (do not SHA-pin)
      - name: initialize CodeQL
        uses: github/codeql-action/init@cf12ceefebab2c867b9c35d7f907e059681d37ab  # v3
        with:
          languages: ${{ matrix.language }}
      - name: build
        run: cargo build --workspace
      - name: perform CodeQL analysis
        uses: github/codeql-action/analyze@cf12ceefebab2c867b9c35d7f907e059681d37ab  # v3
        with:
          category: /language:${{ matrix.language }}
