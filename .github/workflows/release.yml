name: release

# Tag-triggered release: build the binary for each supported target, package a
# tarball + sha256, and attach everything to a GitHub Release. The release
# assets are the product; CI builds a linux-x86_64 artifact on every push so a
# broken release build is caught before tag day.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # Windows aarch64 is best-effort (continue-on-error below), matching
          # the family matrix.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    # Linux is the supported target. macOS/Windows builds are best-effort:
    # the PTY shim is Linux/glibc-specific (ptsname_r), so non-Linux
    # artifacts are produced only if the tree happens to compile there.
    continue-on-error: ${{ !startsWith(matrix.target, 'x86_64-unknown-linux-gnu') && !startsWith(matrix.target, 'aarch64-unknown-linux-gnu') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions-rust-lang/setup-rust-toolchain@46a9d261ee2ace4b93b3bd6e867168ac38627b38  # v1.12.0
        with:
          target: ${{ matrix.target }}

      - name: install aarch64-linux cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: build
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} -p ocserve

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          EXT=""
          case "${{ matrix.target }}" in
            *windows*) OS=windows; EXT=".exe" ;;
            *apple*)   OS=macos ;;
            *linux*)   OS=linux ;;
          esac
          case "${{ matrix.target }}" in
            aarch64*) ARCH=aarch64 ;;
            x86_64*)  ARCH=x86_64 ;;
          esac
          NAME="ocserve-v${VERSION}-${OS}-${ARCH}"
          BIN="target/${{ matrix.target }}/release/ocserve${EXT}"
          mkdir -p "dist/${NAME}"
          cp "$BIN" "dist/${NAME}/ocserve${EXT}"
          cp LICENSE README.md "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
          echo "packaged ${NAME}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.0
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*

  release:
    name: attach release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: artifacts
      - name: combine checksums
        run: |
          find artifacts -type f -name '*.tar.gz' | sort | while read -r f; do
            (cd "$(dirname "$f")" && sha256sum "$(basename "$f")")
          done > artifacts/SHA256SUMS
          cat artifacts/SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v2.2.1
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.tar.gz.sha256
            artifacts/SHA256SUMS
          generate_release_notes: true
          draft: false
