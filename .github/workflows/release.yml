name: release

# Tag-triggered release: build the binary for each supported target, package a
# tarball + sha256, and attach everything to a GitHub Release. The release
# assets are the product; CI builds a linux-x86_64 artifact on every push so a
# broken release build is caught before tag day.
#
# `workflow_dispatch` runs the SAME build matrix without publishing. That
# exists because at v0.4.0 every non-Linux target failed while
# `continue-on-error` made the run green, so the release silently contained two
# tarballs. Tag day must not be the first time a target is built.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      note:
        description: 'reason for this build-only run'
        required: false
        default: 'pre-tag verification' 

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          # Static Linux. The artifact is named linux-<arch>-musl so it cannot
          # collide with the glibc one; fetch-release.sh keeps choosing glibc by
          # default and only takes musl with an explicit request.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # Windows aarch64 is best-effort (continue-on-error below), matching
          # the family matrix.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    # Every target below is required EXCEPT aarch64-pc-windows-msvc, which needs
    # the ARM64 MSVC toolchain on an x64 runner and has never been proven here.
    # Making that one hard would block releases on an environment gap rather
    # than a code defect. The other six are covered before tag day: the glibc
    # targets by the size and cross jobs, macOS and Windows by the required
    # platform checks, and musl by its own required build job.
    continue-on-error: ${{ matrix.target == 'aarch64-pc-windows-msvc' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@c8ff772090ab9d00f7f7bd7b388f3c3032282e3b  # v2.0.0
        with:
          target: ${{ matrix.target }}

      - name: install aarch64-linux cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        # The C dependencies (BoringSSL, SQLite, zstd, brotli) are compiled by
        # a C compiler, so the LINKER variable alone is not enough: BoringSSL's
        # build script asks cmake for `CC_<target>`/`CXX_<target>` and silently
        # falls back to the host compiler, producing x86-64 objects that fail
        # at link time with "Relocations in generic ELF (EM: 62)". Set all
        # three, and install g++ too (BoringSSL is C++).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
          } >> "$GITHUB_ENV"

      - name: install zig (musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        # The C dependencies (SQLite, zstd, brotli, ring) need a C compiler that
        # targets musl; zig provides one through cargo-zigbuild.
        run: |
          python3 -m pip install --quiet --user ziglang
          python3 -c "import ziglang,os;print(os.path.dirname(ziglang.__file__))" > /tmp/zigdir
          echo "PATH=$HOME/.local/bin:$(cat /tmp/zigdir):$PATH" >> "$GITHUB_ENV"
          cargo install --quiet --locked cargo-zigbuild

      - name: build
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            cargo zigbuild --release --target ${{ matrix.target }} -p ocserve
          else
            cargo build --release --target ${{ matrix.target }} -p ocserve
          fi

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          # On a tag the ref name is the version. On workflow_dispatch it is a
          # branch name, so the version must come from Cargo.toml or the
          # artifact would be named after the branch.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          EXT=""
          case "${{ matrix.target }}" in
            *windows*) OS=windows; EXT=".exe" ;;
            *apple*)   OS=macos ;;
            *linux*)   OS=linux ;;
          esac
          case "${{ matrix.target }}" in
            aarch64*) ARCH=aarch64 ;;
            x86_64*)  ARCH=x86_64 ;;
          esac
          # Static builds carry a -musl suffix: same OS/arch, different libc, and
          # a name collision would silently overwrite the glibc tarball.
          LIBC=""
          case "${{ matrix.target }}" in
            *musl*) LIBC="-musl" ;;
          esac
          NAME="ocserve-v${VERSION}-${OS}-${ARCH}${LIBC}"
          BIN="target/${{ matrix.target }}/release/ocserve${EXT}"
          mkdir -p "dist/${NAME}"
          cp "$BIN" "dist/${NAME}/ocserve${EXT}"
          cp LICENSE README.md "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
          echo "packaged ${NAME}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.0
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*

  release:
    name: attach release assets
    # Only a tag publishes. A dispatch is a build-only verification run; its
    # artifacts are still uploaded per-target above.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: artifacts
      - name: combine checksums
        run: |
          find artifacts -type f -name '*.tar.gz' | sort | while read -r f; do
            (cd "$(dirname "$f")" && sha256sum "$(basename "$f")")
          done > artifacts/SHA256SUMS
          cat artifacts/SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.tar.gz.sha256
            artifacts/SHA256SUMS
          generate_release_notes: true
          draft: false
