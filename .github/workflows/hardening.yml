name: hardening

# Supply-chain hardening. cargo-deny is a HARD gate here (advisories, sources,
# bans) — never `|| true`. cargo-outdated is advisory and runs on schedule only.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  deny:
    name: cargo-deny (advisories, sources, bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@c8ff772090ab9d00f7f7bd7b388f3c3032282e3b  # v2.0.0
      - name: install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo-deny
        run: cargo deny check

  unsafe-policy:
    name: unsafe-code policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Non-test crate roots must forbid unsafe; the documented FFI opt-ins
      # carry crate-level `deny` + per-site allow. Keeping the claim in
      # SECURITY.md true (AGENTS §2.10).
      - name: crate roots declare an unsafe policy
        run: |
          fail=0
          for f in crates/*/src/lib.rs crates/*/src/main.rs; do
            [ -f "$f" ] || continue
            if grep -q 'forbid(unsafe_code)' "$f" || grep -q 'deny(unsafe_code)' "$f"; then
              :
            else
              echo "FAIL: $f declares neither forbid(unsafe_code) nor deny(unsafe_code)"; fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "all crate roots declare an unsafe policy"

  outdated:
    name: cargo-outdated (advisory)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@c8ff772090ab9d00f7f7bd7b388f3c3032282e3b  # v2.0.0
      - name: outdated
        run: |
          cargo install cargo-outdated --locked 2>/dev/null || true
          cargo outdated --exit-code 1 || echo "WARN: outdated dependencies (advisory)"
