name: bench

# Criterion (if any) + the committed load-suite thresholds. Dispatch-only by
# default; heavy Docker benches (parity, load-test) run on the local box — see
# bench/parity/README.md and bench/load/README.md. This job is the light,
# CI-safe portion so a perf-harness regression is visible without a runner.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'bench/**'

permissions:
  contents: read

jobs:
  bench:
    name: criterion (if present)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@46a9d261ee2ace4b93b3bd6e867168ac38627b38  # v1.12.0
      - name: cargo bench (no-op if no benches)
        run: cargo bench --workspace --no-run
