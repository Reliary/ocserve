# Snapshot integration harness (SNAPSHOT.md §7.5).
#
# `server`  — ocserve built in-container (bookworm glibc), serving the
#             bind-mounted shared worktree at /work.
# `driver`  — a curl/python driver that mutates + reverts through the server
#             and asserts the observable effects on the shared worktree.
#
# SCRATCH DISCIPLINE: the containers run as root, so anything they write into a
# bind mount is root-owned afterwards. Scratch state therefore lives OUTSIDE the
# repository, in a directory run.sh creates under the system temp dir and
# removes on exit (root-owned, so removal goes through a throwaway container).
#
# It used to live in-tree (./work, ./data, ./freeze-work). Beyond polluting the
# working copy that had two real costs: the repo-root Docker build context
# choked on the unreadable `data` dir ("error from sender"), and every tool
# that walks the tree — `cargo mutants`, ripgrep, git status in some editors —
# failed on it with EACCES. Both symptoms were observed on 2026-10-27/28.
name: snapshot-it

services:
  stub:
    build:
      context: .
      dockerfile: Dockerfile.stub
    environment:
      STUB_PORT: "8080"
    networks: [snap]

  server:
    build:
      context: ../..
      dockerfile: bench/parity/Dockerfile.ocserve
      args: {}
    environment:
      OCSERVE_LEGACY_SYNC: "0"
      HOME: /root
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    volumes:
      - ./config/opencode.json:/root/.config/opencode/opencode.json:ro
      - ./config/auth.json:/root/.local/share/opencode/auth.json:ro
      - ./config/model.json:/root/.local/state/opencode/model.json:ro
      - ./config/password:/run/secrets/snapshot-password:ro
      - ${SNAPSHOT_WORK:-./work}:/work
      - ${SNAPSHOT_DATA:-./data}:/data
    working_dir: /work
    # F5: an auth-off server refuses a non-loopback bind (the credential store
    # echoes provider keys). Inside a compose bridge the driver is a separate
    # container, so the bind must be 0.0.0.0 — which means this arm has to
    # carry real auth. Using it, rather than adding an escape hatch to the
    # guard, also exercises the auth path in-container.
    # override the parity entrypoint: serve /work on 4925, data under /data
    entrypoint: ["ocserve", "serve", "--port", "4925", "--hostname", "0.0.0.0", "--data-dir", "/data", "--auth-mode", "basic", "--auth-password-file", "/run/secrets/snapshot-password"]
    networks: [snap]

  freeze:
    build:
      context: ../parity
      dockerfile: Dockerfile.upstream
    environment:
      HOME: /root
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    volumes:
      - ./config/opencode.json:/root/.config/opencode/opencode.json:ro
      - ./config/auth.json:/root/.local/share/opencode/auth.json:ro
      - ./config/model.json:/root/.local/state/opencode/model.json:ro
      - ${SNAPSHOT_FREEZE:-./freeze-work}:/freeze
    # upstream entrypoint serves on 4921; override to bind the shared worktree
    entrypoint: ["opencode", "serve", "--port", "4926", "--hostname", "0.0.0.0"]
    working_dir: /freeze
    networks: [snap]

  driver:
    build:
      context: .
      dockerfile: Dockerfile.driver
    environment:
      SERVER: "http://server:4925"
      WORK: /work
      AUTH: "${SNAPSHOT_AUTH:?run via run.sh, which generates the password}"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    volumes:
      - ${SNAPSHOT_WORK:-./work}:/work
    depends_on:
      - server
      - stub
    networks: [snap]

  differential:
    build:
      context: .
      dockerfile: Dockerfile.differential
    environment:
      FREEZE: "http://freeze:4926"
      OCSERVE: "http://server:4925"
      AUTH: "${SNAPSHOT_AUTH:?run via run.sh, which generates the password}"
      WF: /freeze
      WO: /work
    volumes:
      - ${SNAPSHOT_FREEZE:-./freeze-work}:/freeze
      - ./work:/work
    depends_on:
      - freeze
      - server
    networks: [snap]

networks:
  snap:
    driver: bridge
