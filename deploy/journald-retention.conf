# Retention floor — applied 2026-10-05 (OOM postmortem follow-up).
#
# Why: the root filesystem runs ~6.8% free — below journald's default
# SystemKeepFree (10% of the fs) — so journald pruned CONTINUOUSLY and the
# user journal only retained ~3 hours (the morning OOM kills were
# unverifiable: journal retention started 13:27 while kills began 10:36).
# Bound growth explicitly instead of pruning by free space: 500M is days of
# logs and cannot materially affect a 3.7T disk.
[Journal]
Storage=persistent
SystemMaxUse=500M
SystemKeepFree=0
