[package]
name = "ocserve-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.ocserve-llm]
path = "../crates/ocserve-llm"

[dependencies.ocserve-store]
path = "../crates/ocserve-store"

[dependencies.ocserve-core]
path = "../crates/ocserve-core"

[dependencies.ocserve-mcp]
path = "../crates/ocserve-mcp"

[dependencies.ocserve]
path = "../crates/ocserve-cli"

[[bin]]
name = "sse_parser"
path = "fuzz_targets/sse_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "splice_parser"
path = "fuzz_targets/splice_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_decode"
path = "fuzz_targets/wire_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "event_decoder"
path = "fuzz_targets/event_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stream_assembler"
path = "fuzz_targets/stream_assembler.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_toml"
path = "fuzz_targets/config_toml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "substr_window"
path = "fuzz_targets/substr_window.rs"
test = false
