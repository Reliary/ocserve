[package]
name = "ocserve-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Provider clients: openai-compatible first; stream assembly + fuzz corpus"

[dependencies]
anyhow.workspace = true
bytes.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util.workspace = true
futures-core = "0.3"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
# BoringSSL for opencode.ai only: their free-tier gate fingerprints the TLS
# stack (verified 2026-10-25: identical bytes + headers pass from Bun's
# BoringSSL and fail from rustls/OpenSSL/curl). reqwest/rustls stays for
# every other provider. See D-ZEN-TLS in PLAN §17.
hyper-boring = "5.3"
boring = "5.3"
ocserve-metrics.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
