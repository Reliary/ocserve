[package]
name = "ocserve-http"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "axum router, auth, byte-golden SSE, error envelope"

[dependencies]
regex = "1"
ocserve-pty = { workspace = true }
rusqlite = { workspace = true }
anyhow.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
bytes.workspace = true
libc.workspace = true
ocserve-store.workspace = true
ocserve-containment.workspace = true
ocserve-core.workspace = true
ocserve-llm.workspace = true
ocserve-tools.workspace = true
ocserve-mcp.workspace = true
ocserve-ui-v1-a.workspace = true
ocserve-ui-v1-b.workspace = true
ocserve-ui-v2-a.workspace = true
ocserve-ui-v2-b.workspace = true
ocserve-ui-v2-c.workspace = true
ocserve-ui-v2-d.workspace = true
ocserve-metrics.workspace = true
ocserve-plugin.workspace = true
futures-util.workspace = true
parking_lot.workspace = true
sha2.workspace = true
base64.workspace = true
hex.workspace = true
flate2 = "1"
brotli = "9"
zstd.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# Issue #80: the stall tests assert on durable rows, but the code logs its
# reason through `tracing`, which is a no-op without a subscriber. A failure
# was therefore indistinguishable from a hang.
tracing-subscriber = { workspace = true }
tower = { workspace = true, features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
tempfile = "3"
http-body-util = "0.1"

# The musl global allocator is mimalloc (ocserve-cli); its force-collect is the
# malloc_trim equivalent. Target-scoped so glibc builds do not link it.
[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
libmimalloc-sys = { version = "0.1", features = ["extended"] }
