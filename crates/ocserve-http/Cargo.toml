[package]
name = "ocserve-http"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "axum router, auth, byte-golden SSE, error envelope"

[dependencies]
regex = "1"
ocserve-pty = { workspace = true }
rusqlite = { workspace = true }
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
bytes.workspace = true
libc.workspace = true
ocserve-store.workspace = true
ocserve-core.workspace = true
ocserve-llm.workspace = true
ocserve-tools.workspace = true
ocserve-mcp.workspace = true
ocserve-metrics.workspace = true
ocserve-plugin.workspace = true
futures-util.workspace = true
metrics.workspace = true
parking_lot.workspace = true
sha2.workspace = true
base64.workspace = true
hex.workspace = true
flate2 = "1"
brotli = "8"
zstd.workspace = true

# Kernel-enforced containment (openat2 RESOLVE_BENEATH) and directory
# iteration from a verified fd. Unix-only by design; the Windows path uses
# handle verification with Win32 APIs instead.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# Handle -> real-path verification and the kernel's own string collation.
# Without these the Windows containment branch does not compile, which is
# exactly what platform-check caught on its first run.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Globalization",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
tempfile = "3"
http-body-util = "0.1"

# The musl global allocator is mimalloc (ocserve-cli); its force-collect is the
# malloc_trim equivalent. Target-scoped so glibc builds do not link it.
[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
libmimalloc-sys = { version = "0.1", features = ["extended"] }
