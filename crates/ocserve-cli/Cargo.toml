[package]
name = "ocserve"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "ocserve binary: serve, import, doctor, replay, backup, models, env-reference"

[[bin]]
name = "ocserve"
path = "src/main.rs"

[dependencies]

libc.workspace = true
axum.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap.workspace = true
toml.workspace = true
ocserve-core.workspace = true
ocserve-store.workspace = true
ocserve-http.workspace = true
ocserve-mcp.workspace = true
ocserve-plugin.workspace = true
ocserve-metrics.workspace = true
ocserve-importer.workspace = true
rusqlite.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
metrics.workspace = true

sha1 = "0.11"

[dev-dependencies]
tempfile = "3"

# musl has no malloc_trim, and its allocator retained the freed catalog build
# pages (measured 447 MB RSS vs 193 MB on glibc for the same boot). mimalloc
# plus an explicit mi_collect is the portable purge; glibc keeps malloc_trim.
# Target-scoped so the glibc and Darwin binaries are unchanged.
[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
mimalloc = { version = "0.1" }
libmimalloc-sys = { version = "0.1", features = ["extended"] }
