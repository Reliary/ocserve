[package]
name = "ocserve-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "SQLite + chunked blob store: pragmas, schema, single-writer, FTS5"

[dependencies]
base64 = "0.23"
rusqlite.workspace = true
zstd.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
bytes.workspace = true
tracing.workspace = true
sha2.workspace = true
hex.workspace = true
parking_lot.workspace = true

[dev-dependencies]
tempfile = "3"

# Kernel-enforced containment (openat2 RESOLVE_BENEATH) — moved here from
# ocserve-http so the tools crate (v2 `patch`) can share one implementation.
# Unix-only by design; Windows uses handle verification instead.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true
libc.workspace = true

# Handle -> real-path verification and the kernel's string collation, needed
# by the Windows containment branch.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Globalization",
] }
